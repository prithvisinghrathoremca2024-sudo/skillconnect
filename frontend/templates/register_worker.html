{% extends 'base.html' %}
{% block content %}
<div class="container" style="max-width: 650px;">
  <div class="card p-4 mt-3">
    <h3 class="fw-bold text-center mb-3">Worker Registration</h3>
    <form method="POST">
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" name="name" class="form-control" required>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Email Address</label>
          <input type="email" name="email" class="form-control" required>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Phone Number</label>
          <input type="text" name="phone" class="form-control" required>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Primary Skill</label>
          <input type="text" name="primary_skill" class="form-control" placeholder="e.g. Carpentry" required>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Hourly Rate (₹)</label>
          <input type="number" name="price_per_hour" class="form-control" placeholder="350" required>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">City</label>
          <input type="text" name="city" class="form-control" required>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Area / Locality</label>
          <input type="text" name="area" class="form-control" required>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Full Address</label>
        <textarea name="address" class="form-control" rows="2" required></textarea>
      </div>
      <div class="mb-3">
        <label class="form-label">About / Bio</label>
        <textarea name="about" class="form-control" rows="3" placeholder="Describe your experience and work background..."></textarea>
      </div>
      <button type="submit" class="btn btn-success w-100 btn-lg">Submit Worker Registration</button>
    </form>
  </div>
</div>
{% endblock %}
