{% extends 'base.html' %}
{% block content %}
<div class="container">
  <h2 class="fw-bold mb-4 text-center">Service Categories</h2>
  <div class="row g-4">
    {% for cat in categories %}
    <div class="col-md-3">
      <div class="card h-100 p-3 text-center">
        <i class="bi bi-tools display-4 text-primary mb-2"></i>
        <h5 class="fw-bold mb-2">{{ cat.name }}</h5>
        <p class="text-muted small mb-3">{{ cat.description }}</p>
        <a href="{{ url_for('workers', skill=cat.name) }}" class="btn btn-outline-primary btn-sm mt-auto">Find Workers</a>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
